---
driver:
  name: vagrant
verifier:
  name: inspec
  inspec_tests:
    - path: test/integration/default
provisioner:
  name: chef_zero
  chef_license: accept-no-persist
  product_name: cinc
  multiple_converge: 2
  enforce_idempotency: true
  deprecations_as_errors: true
platforms:
  - name: almalinux-8
  - name: almalinux-9
  - name: amazonlinux-2023
  - name: centos-stream-9
  - name: debian-12
  - name: debian-13
  - name: fedora-latest
  - name: opensuse-leap-16
  - name: oraclelinux-8
  - name: oraclelinux-9
  - name: rockylinux-8
  - name: rockylinux-9
  - name: ubuntu-20.04
  - name: ubuntu-22.04
  - name: ubuntu-24.04
suites:
  - name: default
    run_list:
      - recipe[test::default]
